# SPDX-License-Identifier: GPL-3.0-or-later
# Builds and tests Prisma for Mac on GitHub's Macs on every change to mac/. Versions are
# published by release.yml ("Publicar versión"), which builds Windows and Mac together.
name: Prisma para Mac

on:
  push:
    branches: [main]
    paths: ["mac/**", "src/prisma_resolve.lua", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Versión de Swift
        run: swift --version
      - name: Instalar libmpv (motor del AV1) y dylibbundler
        run: brew install --quiet mpv dylibbundler
      - name: Pruebas
        working-directory: mac
        run: swift test
      - name: Compilar Prisma.app
        run: bash mac/build-app.sh
      - name: Abrir la app con un vídeo de prueba
        run: bash mac/smoke-test.sh
      - name: Abrir un AV1 de 10 bits con libmpv
        run: bash mac/smoke-test-av1.sh
      - name: Guardar el zip
        uses: actions/upload-artifact@v4
        with:
          name: Prisma-mac
          path: |
            mac/build/Prisma-*-mac.zip
            mac/build/SHA256.txt
            mac/build/captura.jpg
            mac/build/mpv/procedencia.txt

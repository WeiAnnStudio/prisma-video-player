# SPDX-License-Identifier: GPL-3.0-or-later
# Prueba previa al AV1 en Mac (Prisma 0.6): ¿se puede meter libmpv dentro de la app, decodifica
# AV1 de 10 bits en un Mac con chip Apple y cuánto pesa? No toca la app: solo mide y avisa.
# Se lanza a mano (Actions > "Prueba de libmpv en Mac" > Run workflow) o al cambiar estos archivos.
name: Prueba de libmpv en Mac

on:
  push:
    paths: [".github/workflows/mpv-prueba.yml", "mac/prueba-mpv/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mpv:
    runs-on: macos-15          # Apple Silicon (M1)
    timeout-minutes: 40
    env:
      CARPETA: ${{ github.workspace }}/mpv-empaquetado
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Máquina de pruebas
        run: |
          uname -m
          sw_vers
          # La prueba solo tiene sentido en un Mac con chip Apple.
          test "$(uname -m)" = "arm64"

      - name: Instalar mpv, ffmpeg y dylibbundler
        run: brew install mpv ffmpeg dylibbundler

      - name: Crear un clip AV1 de 10 bits (3 s)
        run: |
          # Se prefiere SVT-AV1; si esta ffmpeg no lo trae, se usa libaom.
          if ffmpeg -hide_banner -encoders | grep -q libsvtav1; then
            CODIFICADOR="-c:v libsvtav1 -crf 40 -preset 10"
          else
            CODIFICADOR="-c:v libaom-av1 -crf 40 -cpu-used 8"
          fi
          ffmpeg -hide_banner -y \
            -f lavfi -i testsrc2=size=1280x720:rate=24:duration=3 \
            -f lavfi -i sine=frequency=440:duration=3 \
            $CODIFICADOR -pix_fmt yuv420p10le -c:a aac -shortest clip.mp4
          ffprobe -hide_banner clip.mp4

      - name: Qué dice macOS del clip (solo información)
        continue-on-error: true
        run: swift mac/prueba-mpv/detectar-av1.swift clip.mp4

      - name: Reproducir con el mpv de Homebrew (sin ventana)
        run: |
          mpv --no-config --vo=null --ao=null --hwdec=no --untimed --msg-level=all=v clip.mp4 | tee mpv.log
          grep -qi dav1d mpv.log   # tiene que haber decodificado con dav1d

      - name: Empaquetar libmpv con todas sus librerías
        run: bash mac/prueba-mpv/empaquetar.sh "$CARPETA"

      - name: Probar el paquete en una carpeta aislada
        run: |
          # Se copia a otro sitio y se mira qué librerías carga de verdad: ninguna de Homebrew.
          cp -R "$CARPETA" "$RUNNER_TEMP/aislado"
          DYLD_PRINT_LIBRARIES=1 "$RUNNER_TEMP/aislado/MacOS/probar-libmpv" clip.mp4 \
            > prueba.log 2> cargadas.log || {
              echo "--- salida del programa ---"; cat prueba.log
              echo "--- últimas líneas de lo que cargó macOS ---"; tail -25 cargadas.log
              exit 1
            }
          cat prueba.log
          if grep -E "/opt/homebrew|/usr/local" cargadas.log; then
            echo "::error::El paquete sigue cargando librerías de fuera"; exit 1
          fi

      - name: Diagnóstico del paquete (solo si falla)
        if: failure()
        run: |
          # Rutas de cada librería: lo que siga apuntando a @rpath o a Homebrew es lo que falta arreglar.
          otool -L "$CARPETA/MacOS/probar-libmpv"
          otool -l "$CARPETA/MacOS/probar-libmpv" | grep -A2 LC_RPATH || true
          for f in "$CARPETA"/Frameworks/*.dylib; do
            otool -L "$f" | tail -n +2 | grep -E "@rpath|/opt/homebrew|/usr/local" | sed "s|^|$(basename "$f"): |" || true
          done | head -60

      - name: Medir tamaño, arquitectura y macOS mínimo
        if: always()
        run: |
          FW="$CARPETA/Frameworks"
          ditto -c -k --keepParent "$FW" libmpv-empaquetado.zip
          NUM=$(ls "$FW" | wc -l | tr -d ' ')
          DESCOMPRIMIDO=$(du -sk "$FW" | awk '{printf "%.1f", $1/1024}')
          ZIP=$(stat -f%z libmpv-empaquetado.zip | awk '{printf "%.1f", $1/1048576}')
          # Cada librería dice a partir de qué macOS funciona (la app declara macOS 13).
          MINIMO=$(for f in "$FW"/*.dylib; do vtool -show-build "$f" | awk '/minos/ {print $2}'; done | sort -V | tail -1)
          ARQ=$(lipo -archs "$FW"/libmpv*.dylib | sort -u | tr '\n' ' ')
          # De dónde sale cada paquete (para la lista de procedencia y licencias).
          grep -o '/opt/homebrew/[^ ]*' "$CARPETA/dylibbundler.log" \
            | sed -E 's#/opt/homebrew/(Cellar|opt)/([^/]+)(/([0-9][^/]*))?.*#\2 \4#' | sort -u > procedencia.txt
          {
            echo "## Resultado de la prueba de libmpv"
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Librerías incluidas | $NUM |"
            echo "| Tamaño descomprimido | $DESCOMPRIMIDO MB |"
            echo "| Tamaño del zip | $ZIP MB |"
            echo "| Arquitectura | $ARQ|"
            echo "| macOS mínimo que piden las librerías | $MINIMO (la app declara 13.0) |"
            echo
            echo "### Procedencia (Homebrew)"
            echo '```'; cat procedencia.txt; echo '```'
            echo "### Prueba de decodificación"
            echo '```'; cat prueba.log 2>/dev/null || true; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpv-prueba
          retention-days: 14
          path: |
            libmpv-empaquetado.zip
            mpv.log
            prueba.log
            cargadas.log
            procedencia.txt
            mpv-empaquetado/dylibbundler.log
